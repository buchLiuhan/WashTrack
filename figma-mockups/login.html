<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WashTrack — Login</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="frame-wrap">
  <div class="frame-label">Login</div>
  <div class="phone-frame">
    <div class="page-body" style="display:flex;flex-direction:column;justify-content:center;padding:32px;">

      <div class="page-title" style="color:var(--primary);text-align:center;font-size:28px;">WashTrack</div>
      <div class="page-title" style="text-align:center;">Owner Login</div>

      <label class="field-label">Username</label>
      <input class="entry" placeholder="e.g. owner">

      <label class="field-label">Password</label>
      <input class="entry" type="password" placeholder="Enter password">

      <button class="btn" style="margin-top:24px;">Log In</button>

      <div class="muted" style="text-align:center;color:var(--accent);margin-top:16px;font-weight:700;">Forgot password?</div>

    </div>
  </div>
</div>

<div class="frame-wrap">
  <div class="frame-label">Register (owner setup)</div>
  <div class="phone-frame">
    <div class="page-body" style="display:flex;flex-direction:column;justify-content:center;padding:32px;">

      <div class="page-title" style="color:var(--primary);text-align:center;font-size:28px;">WashTrack</div>
      <div class="page-title" style="text-align:center;">Create Owner Account</div>
      <div class="muted" style="text-align:center;margin-bottom:8px;">Set up the owner account to get started.</div>

      <label class="field-label">Username</label>
      <input class="entry" placeholder="e.g. owner">

      <label class="field-label">Password</label>
      <input class="entry" type="password" placeholder="Enter password">

      <label class="field-label">Confirm Password</label>
      <input class="entry" type="password" placeholder="Re-enter password">

      <label class="field-label">Security Question (for password recovery)</label>
      <select class="picker">
        <option>Choose a question</option>
      </select>

      <label class="field-label">Your Answer</label>
      <input class="entry" placeholder="Answer">

      <button class="btn" style="margin-top:24px;">Create Account</button>

    </div>
  </div>
</div>

</body>
</html>
