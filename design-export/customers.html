<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WashTrack — Customers</title>
<style>
:root {
  --primary: #034078; --primary-dark: #001f54; --primary-darkest: #051923; --accent: #1282a2;
  --dark-navy: #0a1128; --page-bg: #fefcfb; --card-bg: #ffffff; --input-bg: #f5f5f5;
  --text-primary: #0a1128; --text-light: #fefcfb; --text-muted: #888888; --text-accent: #1282a2;
  --success: #2ecc71; --danger: #e74c3c; --warning: #f39c12; --warning-bg: #fff3cd; --warning-text: #856404;
  --border: #e0e0e0; --font: "Open Sans", "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: #dfe4e8; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 32px 16px; }
.phone { width: 390px; height: 844px; background: var(--page-bg); border-radius: 36px; border: 10px solid #111; box-shadow: 0 20px 40px rgba(0,0,0,.25); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.phone-label { width: 390px; text-align: center; font-family: var(--font); font-weight: 700; color: #333; margin-bottom: -8px; }
.status-bar { height: 28px; background: var(--page-bg); flex-shrink: 0; }
.nav-bar { background: var(--page-bg); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.nav-title { font-size: 19px; font-weight: 700; color: var(--text-primary); }
.nav-action { font-size: 14px; font-weight: 700; color: var(--primary); }
.content { flex: 1; overflow-y: auto; padding: 16px; }
.content::-webkit-scrollbar { width: 0; }
.tab-bar { display: flex; background: var(--primary-dark); flex-shrink: 0; padding: 8px 0 14px; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(254,252,251,.55); font-size: 11px; font-weight: 600; }
.tab-item.active { color: var(--text-light); }
.tab-icon { font-size: 18px; line-height: 1; }
.page-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin: 0 0 8px; }
.section-header { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--primary); margin: 16px 0 6px; }
.section-header:first-child { margin-top: 0; }
.field-label { font-size: 13px; font-weight: 700; color: var(--text-primary); margin: 8px 0 4px; display: block; }
.muted { font-size: 13px; color: var(--text-muted); }
.accent-label { font-size: 16px; font-weight: 700; color: var(--accent); }
.empty-state { font-size: 15px; color: var(--text-muted); text-align: center; padding: 40px 20px; }
.btn { font-family: var(--font); font-weight: 600; font-size: 15px; border-radius: 8px; padding: 12px 16px; height: 48px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn-primary { background: var(--primary); color: var(--text-light); }
.btn-accent { background: var(--accent); color: var(--text-light); }
.btn-secondary { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-danger { background: var(--danger); color: var(--text-light); }
.btn-complete { background: var(--input-bg); color: var(--text-muted); }
.btn-sm { height: 36px; padding: 0 10px; font-size: 12px; }
.btn-xs { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; background: transparent; border: 1px solid var(--primary); color: var(--primary); }
.btn-block { width: 100%; }
.entry, .picker, select.entry { width: 100%; background: var(--input-bg); border: none; border-radius: 8px; padding: 0 14px; height: 48px; font-size: 14px; color: var(--text-primary); font-family: var(--font); margin-bottom: 4px; }
.entry::placeholder { color: var(--text-muted); }
.search-bar { background: var(--input-bg); }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin: 4px 0; }
.card-dark { background: var(--primary); border-radius: 10px; padding: 16px; margin: 4px 0; color: var(--text-light); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700; color: var(--text-light); }
.pill-primary { background: var(--primary); }
.pill-accent { background: var(--accent); }
.pill-success { background: var(--success); }
.pill-warning { background: var(--warning); }
.pill-danger { background: var(--danger); }
.pill-neutral { background: var(--border); color: var(--text-primary); }
.banner { background: var(--warning-bg); border: 1px solid var(--warning); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--warning-text); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stack-center { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.avatar { width: 48px; height: 48px; border-radius: 24px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: var(--text-light); font-size: 18px; flex-shrink: 0; }
</style>
</head>
<body>

<div>
  <div class="phone-label">Customers</div>
  <div class="phone">
    <div class="status-bar"></div>
    <div class="nav-bar"><span class="nav-title">Customers</span></div>

    <div class="row-between" style="padding:8px 16px;gap:8px;">
      <input class="entry search-bar" style="margin:0;" placeholder="Search customers...">
      <button class="btn btn-secondary btn-sm" style="flex-shrink:0;">Show Inactive</button>
    </div>
    <div style="padding:0 16px 8px;text-align:right;">
      <button class="btn btn-secondary btn-sm">Active Orders Only</button>
    </div>

    <div class="content" style="padding-top:0;">

      <div class="card">
        <div style="display:flex;gap:12px;">
          <div class="avatar">👤</div>
          <div>
            <div style="font-weight:700;font-size:16px;color:var(--text-primary);">Maria Santos</div>
            <div class="muted">0917 123 4567</div>
            <span class="pill pill-warning" style="margin-top:2px;">₱ Pending Payment</span>
          </div>
        </div>
        <div class="grid-2" style="margin-top:10px;">
          <button class="btn btn-accent btn-sm">Edit</button>
          <button class="btn btn-danger btn-sm">Deactivate</button>
        </div>
        <div class="muted" style="margin-top:8px;font-size:12px;">1 active order(s)</div>
      </div>

      <div class="card">
        <div style="display:flex;gap:12px;">
          <div class="avatar">👤</div>
          <div>
            <div style="font-weight:700;font-size:16px;color:var(--text-primary);">Juan Dela Cruz</div>
            <div class="muted">0917 555 8899</div>
          </div>
        </div>
        <div class="grid-2" style="margin-top:10px;">
          <button class="btn btn-accent btn-sm">Edit</button>
          <button class="btn btn-danger btn-sm">Deactivate</button>
        </div>
        <div class="muted" style="margin-top:8px;font-size:12px;">No active orders</div>
      </div>

      <div class="card">
        <div style="display:flex;gap:12px;">
          <div class="avatar">👤</div>
          <div>
            <div style="font-weight:700;font-size:16px;color:var(--text-primary);">Anna Reyes</div>
            <div class="muted">0928 222 3344</div>
          </div>
        </div>
        <div class="grid-2" style="margin-top:10px;">
          <button class="btn btn-accent btn-sm">Edit</button>
          <button class="btn btn-danger btn-sm">Deactivate</button>
        </div>
        <div class="muted" style="margin-top:8px;font-size:12px;">No active orders</div>
      </div>

    </div>

    <div class="tab-bar">
      <div class="tab-item"><span class="tab-icon">🏠</span>Dashboard</div>
      <div class="tab-item"><span class="tab-icon">🧺</span>Services</div>
      <div class="tab-item"><span class="tab-icon">🧾</span>Transactions</div>
      <div class="tab-item active"><span class="tab-icon">👤</span>Customers</div>
      <div class="tab-item"><span class="tab-icon">📦</span>Inventory</div>
      <div class="tab-item"><span class="tab-icon">📊</span>Reports</div>
    </div>
  </div>
</div>

</body>
</html>
